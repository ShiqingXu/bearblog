<figure class="image-caption{{ if $.Page.Site.Params.imageZoom }} image-zoom-container{{ end }}">
    {{ if $.Page.Site.Params.imageZoom }}
    <input type="checkbox" id="img-{{ substr (md5 .Destination) 0 8 }}" class="image-zoom-toggle" aria-label="放大图片" />
    <label for="img-{{ substr (md5 .Destination) 0 8 }}" class="image-zoom-label">
        <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" class="zoomable-image" />
    </label>
    <label for="img-{{ substr (md5 .Destination) 0 8 }}" class="image-zoom-overlay" aria-hidden="true"></label>
    {{ else }}
    <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" />
    {{ end }}
</figure>
